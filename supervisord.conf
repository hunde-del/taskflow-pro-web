[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s
autorestart=true
priority=100

[program:fluxbox]
command=fluxbox
autorestart=true
priority=200

[program:x11vnc]
command=x11vnc -display :1 -passwd Password123 -listen localhost -forever -shared
autorestart=true
priority=300

[program:java_app]
command=java -jar /app/TaskFlowPro.jar
autorestart=true
priority=400

[program:novnc]
command=websockify --web /usr/share/novnc 8080 localhost:5900
autorestart=true
priority=500

